<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Troubleshooting Engine – test console</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; color: #1b1b1f; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; }
  button { font: inherit; padding: 8px 16px; margin-top: 8px; cursor: pointer; }
  pre { background: #f4f4f6; padding: 12px; overflow: auto; font-size: 13px; }
  .meta { color: #555; }
</style>
</head>
<body>
<h1>Smart Guided Troubleshooting Engine</h1>
<p class="meta">Phase 1 test console. The phone-style demo UI arrives in Phase 4. API docs: <a href="/docs">/docs</a></p>
<label>Complaint<br><textarea id="q" rows="3">My Galaxy S22 screen inputs are delayed and the touch responsiveness is laggy.</textarea></label>
<label>Reference text (siis_response, optional)<br><textarea id="s" rows="6"></textarea></label>
<label><input type="checkbox" id="dbg"> include debug trace</label><br>
<button id="go">Troubleshoot</button>
<p class="meta" id="stat"></p>
<pre id="out"></pre>
<script>
document.getElementById('go').onclick = async () => {
  const body = { query: document.getElementById('q').value };
  const s = document.getElementById('s').value.trim();
  if (s) body.siis_response = s;
  const url = '/v1/troubleshoot' + (document.getElementById('dbg').checked ? '?debug=true' : '');
  const res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const json = await res.json();
  const m = json.meta || {};
  document.getElementById('stat').textContent = `HTTP ${res.status} · ${m.latency_ms} ms · cache_hit=${m.cache_hit} · ${m.fallback || 'plan'}`;
  document.getElementById('out').textContent = JSON.stringify(json, null, 2);
};
</script>
</body>
</html>
